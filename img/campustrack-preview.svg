<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="ctBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1728" />
      <stop offset="50%" stop-color="#14213d" />
      <stop offset="100%" stop-color="#091224" />
    </linearGradient>
    <linearGradient id="cardBg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#ctBg)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <circle cx="620" cy="180" r="160" fill="#38bdf8" fill-opacity="0.12" filter="url(#glow3)"/>
  <circle cx="180" cy="320" r="140" fill="#6366f1" fill-opacity="0.1" filter="url(#glow3)"/>

  <!-- Left Side: Title & Info -->
  <g transform="translate(60, 65)">
    <!-- Infosys Springboard Tag -->
    <rect width="210" height="32" rx="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
    <circle cx="18" cy="16" r="6" fill="#818cf8"/>
    <text x="32" y="21" fill="#c7d2fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">INFOSYS SPRINGBOARD INTERNSHIP</text>

    <text x="0" y="80" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">CampusTrack</text>
    <text x="0" y="115" fill="#818cf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600">Lost &amp; Found Portal</text>

    <text x="0" y="155" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      <tspan x="0" dy="0">Production-grade full-stack platform for reporting,</tspan>
      <tspan x="0" dy="24">locating, and claiming lost items on campus.</tspan>
    </text>

    <!-- Highlights Grid -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="140" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" fill="#818cf8" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">RESTful APIs</text>
      <text x="14" y="40" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Fast Search &amp; Filter</text>

      <rect x="150" y="0" width="140" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="164" y="22" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">JWT Security</text>
      <text x="164" y="40" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Role-Based Access</text>
    </g>

    <!-- Tech Stack pills -->
    <g transform="translate(0, 285)">
      <rect x="0" y="0" width="70" height="24" rx="4" fill="#3730a3" fill-opacity="0.4"/>
      <text x="35" y="16" fill="#a5b4fc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">React.js</text>

      <rect x="78" y="0" width="85" height="24" rx="4" fill="#3730a3" fill-opacity="0.4"/>
      <text x="120.5" y="16" fill="#a5b4fc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Spring Boot</text>

      <rect x="171" y="0" width="60" height="24" rx="4" fill="#3730a3" fill-opacity="0.4"/>
      <text x="201" y="16" fill="#a5b4fc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">MySQL</text>

      <rect x="239" y="0" width="55" height="24" rx="4" fill="#3730a3" fill-opacity="0.4"/>
      <text x="266.5" y="16" fill="#a5b4fc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">JWT</text>
    </g>
  </g>

  <!-- Right Side: CampusTrack Locator UI Card -->
  <g transform="translate(420, 55)">
    <rect width="320" height="370" rx="16" fill="url(#cardBg3)" stroke="#818cf8" stroke-width="1.5" filter="url(#glow3)"/>
    
    <!-- Window controls -->
    <circle cx="25" cy="25" r="5" fill="#ef4444"/>
    <circle cx="42" cy="25" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="25" r="5" fill="#10b981"/>
    <text x="160" y="29" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">campustrack.edu/locator</text>
    <line x1="0" y1="45" x2="320" y2="45" stroke="#334155" stroke-width="1"/>

    <!-- Search Bar Mockup -->
    <rect x="20" y="65" width="280" height="38" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="89" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="12">🔍 Search "Blue ID Card", "Calculators"...</text>

    <!-- Found Item Card 1 -->
    <rect x="20" y="115" width="280" height="70" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="30" y="125" width="50" height="50" rx="6" fill="#1e1b4b"/>
    <text x="55" y="157" fill="#818cf8" font-family="'Segoe UI', sans-serif" font-size="22" text-anchor="middle">🎒</text>
    <text x="90" y="142" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">HP Laptop Charger</text>
    <text x="90" y="158" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Library 2nd Floor • 2 hrs ago</text>
    <rect x="230" y="130" width="60" height="20" rx="10" fill="#065f46"/>
    <text x="260" y="144" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">FOUND</text>

    <!-- Lost Item Card 2 -->
    <rect x="20" y="195" width="280" height="70" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="30" y="205" width="50" height="50" rx="6" fill="#31102b"/>
    <text x="55" y="237" fill="#f43f5e" font-family="'Segoe UI', sans-serif" font-size="22" text-anchor="middle">🔑</text>
    <text x="90" y="222" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">Hostel Key Set &amp; ID</text>
    <text x="90" y="238" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Cafeteria Block A • Today</text>
    <rect x="230" y="210" width="60" height="20" rx="10" fill="#7f1d1d"/>
    <text x="260" y="224" fill="#f87171" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">LOST</text>

    <!-- Item Status Bottom Bar -->
    <rect x="20" y="280" width="280" height="65" rx="8" fill="#1e1b4b" fill-opacity="0.4" stroke="#818cf8" stroke-width="1"/>
    <text x="35" y="305" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Verification &amp; Claim Module</text>
    <text x="35" y="325" fill="#c7d2fe" font-family="'Segoe UI', sans-serif" font-size="10">Verified match alerts via automated student portal</text>
  </g>
</svg>


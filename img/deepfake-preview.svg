<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="dfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140826" />
      <stop offset="50%" stop-color="#1f103c" />
      <stop offset="100%" stop-color="#0e061c" />
    </linearGradient>
    <linearGradient id="cardBg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1435" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#110a20" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#dfBg)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#a855f7" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <circle cx="620" cy="180" r="160" fill="#a855f7" fill-opacity="0.12" filter="url(#glow4)"/>
  <circle cx="180" cy="320" r="140" fill="#ec4899" fill-opacity="0.1" filter="url(#glow4)"/>

  <!-- Left Side: Title & Info -->
  <g transform="translate(60, 65)">
    <rect width="180" height="32" rx="16" fill="#581c87" stroke="#c084fc" stroke-width="1"/>
    <circle cx="18" cy="16" r="6" fill="#c084fc"/>
    <text x="32" y="21" fill="#e9d5ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">COMPUTER VISION &amp; AI</text>

    <text x="0" y="80" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">Deepfake</text>
    <text x="0" y="115" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600">Detection System</text>

    <text x="0" y="155" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      <tspan x="0" dy="0">Convolutional Neural Network (CNN) pipeline</tspan>
      <tspan x="0" dy="24">for classifying authentic vs. manipulated facial media.</tspan>
    </text>

    <!-- Highlights Grid -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="140" height="52" rx="8" fill="#1e1435" stroke="#3b1f63" stroke-width="1"/>
      <text x="14" y="22" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800">75% Accuracy</text>
      <text x="14" y="40" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Binary Classification</text>

      <rect x="150" y="0" width="140" height="52" rx="8" fill="#1e1435" stroke="#3b1f63" stroke-width="1"/>
      <text x="164" y="22" fill="#f472b6" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800">CNN Model</text>
      <text x="164" y="40" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">OpenCV Preprocessing</text>
    </g>

    <!-- Tech Stack pills -->
    <g transform="translate(0, 285)">
      <rect x="0" y="0" width="60" height="24" rx="4" fill="#6b21a8" fill-opacity="0.4"/>
      <text x="30" y="16" fill="#d8b4fe" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Python</text>

      <rect x="68" y="0" width="85" height="24" rx="4" fill="#6b21a8" fill-opacity="0.4"/>
      <text x="110.5" y="16" fill="#d8b4fe" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">TensorFlow</text>

      <rect x="161" y="0" width="55" height="24" rx="4" fill="#6b21a8" fill-opacity="0.4"/>
      <text x="188.5" y="16" fill="#d8b4fe" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Keras</text>

      <rect x="224" y="0" width="65" height="24" rx="4" fill="#6b21a8" fill-opacity="0.4"/>
      <text x="256.5" y="16" fill="#d8b4fe" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">OpenCV</text>
    </g>
  </g>

  <!-- Right Side: AI Facial Scan / Detection UI Card -->
  <g transform="translate(420, 55)">
    <rect width="320" height="370" rx="16" fill="url(#cardBg4)" stroke="#c084fc" stroke-width="1.5" filter="url(#glow4)"/>
    
    <!-- Window controls -->
    <circle cx="25" cy="25" r="5" fill="#ef4444"/>
    <circle cx="42" cy="25" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="25" r="5" fill="#10b981"/>
    <text x="160" y="29" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">deepfake-detector/inference</text>
    <line x1="0" y1="45" x2="320" y2="45" stroke="#3b1f63" stroke-width="1"/>

    <!-- Biometric Face Scan Simulation -->
    <rect x="35" y="65" width="250" height="195" rx="10" fill="#0c0717" stroke="#2e1065" stroke-width="1"/>
    
    <!-- Face Silhouette / Mesh Nodes -->
    <ellipse cx="160" cy="155" rx="50" ry="65" fill="none" stroke="#a855f7" stroke-dasharray="4,4" stroke-width="1.5"/>
    
    <!-- Target bounding box corners -->
    <path d="M 85 90 L 105 90 M 85 90 L 85 110" stroke="#c084fc" stroke-width="2.5" fill="none"/>
    <path d="M 235 90 L 215 90 M 235 90 L 235 110" stroke="#c084fc" stroke-width="2.5" fill="none"/>
    <path d="M 85 220 L 105 220 M 85 220 L 85 200" stroke="#c084fc" stroke-width="2.5" fill="none"/>
    <path d="M 235 220 L 215 220 M 235 220 L 235 200" stroke="#c084fc" stroke-width="2.5" fill="none"/>

    <!-- Laser Scanning Line -->
    <line x1="90" y1="140" x2="230" y2="140" stroke="#ec4899" stroke-width="2" filter="url(#glow4)"/>

    <!-- Detection Result Overlay inside box -->
    <rect x="50" y="195" width="220" height="50" rx="6" fill="#1e1035" stroke="#c084fc" stroke-width="1"/>
    <text x="65" y="215" fill="#e9d5ff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Classification Result:</text>
    <text x="65" y="235" fill="#4ade80" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">AUTHENTIC (75% Conf.)</text>

    <!-- CNN Architecture Pipeline -->
    <g transform="translate(35, 275)">
      <rect width="250" height="70" rx="8" fill="#140b24" stroke="#3b1f63" stroke-width="1"/>
      <text x="15" y="25" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">End-to-End Deep Learning</text>
      <text x="15" y="44" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Preprocess → Conv2D → MaxPooling → Dense</text>
      <text x="15" y="60" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">Trained on real vs. manipulated face datasets</text>
    </g>
  </g>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="quoteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1526" />
      <stop offset="50%" stop-color="#141e33" />
      <stop offset="100%" stop-color="#09131f" />
    </linearGradient>
    <linearGradient id="quoteEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#quoteBg)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#10b981" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Glowing background circles -->
  <circle cx="620" cy="180" r="160" fill="#10b981" fill-opacity="0.1" filter="url(#glow2)"/>
  <circle cx="180" cy="320" r="140" fill="#06b6d4" fill-opacity="0.1" filter="url(#glow2)"/>

  <!-- Left Side: Title & Key Metrics -->
  <g transform="translate(60, 70)">
    <rect width="175" height="32" rx="16" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="1"/>
    <circle cx="18" cy="16" r="6" fill="#10b981"/>
    <text x="32" y="21" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">MERN ENTERPRISE</text>

    <text x="0" y="80" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">Auto-Quotation</text>
    <text x="0" y="115" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600">Smart Generator &amp; PDF Engine</text>

    <text x="0" y="155" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      <tspan x="0" dy="0">Dynamic quotation billing with automated tax,</tspan>
      <tspan x="0" dy="24">multi-item discounts &amp; instant PDF invoicing.</tspan>
    </text>

    <!-- Key Metrics Highlight -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="140" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800">&lt; 1 Minute</text>
      <text x="14" y="40" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">from 30 min manual</text>

      <rect x="150" y="0" width="140" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="164" y="22" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800">100% Exact</text>
      <text x="164" y="40" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Tax &amp; Discount Calc</text>
    </g>

    <!-- Tech Stack pills -->
    <g transform="translate(0, 285)">
      <rect x="0" y="0" width="70" height="24" rx="4" fill="#047857" fill-opacity="0.3"/>
      <text x="35" y="16" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">MongoDB</text>

      <rect x="78" y="0" width="75" height="24" rx="4" fill="#047857" fill-opacity="0.3"/>
      <text x="115.5" y="16" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Express.js</text>

      <rect x="161" y="0" width="65" height="24" rx="4" fill="#047857" fill-opacity="0.3"/>
      <text x="193.5" y="16" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">React.js</text>

      <rect x="234" y="0" width="65" height="24" rx="4" fill="#047857" fill-opacity="0.3"/>
      <text x="266.5" y="16" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Node.js</text>
    </g>
  </g>

  <!-- Right Side: Quotation Invoice Mockup -->
  <g transform="translate(420, 55)">
    <rect width="320" height="370" rx="16" fill="url(#cardBg2)" stroke="#10b981" stroke-width="1.5" filter="url(#glow2)"/>
    
    <!-- Window controls -->
    <circle cx="25" cy="25" r="5" fill="#ef4444"/>
    <circle cx="42" cy="25" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="25" r="5" fill="#10b981"/>
    <text x="160" y="29" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">quotation-manager.io/export</text>
    <line x1="0" y1="45" x2="320" y2="45" stroke="#334155" stroke-width="1"/>

    <!-- Document simulation -->
    <rect x="25" y="65" width="270" height="210" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Invoice Header -->
    <text x="40" y="95" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">COMMERCIAL QUOTATION</text>
    <text x="40" y="112" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Invoice #QT-2026-0891</text>
    <rect x="210" y="80" width="70" height="22" rx="4" fill="#059669" fill-opacity="0.3"/>
    <text x="245" y="95" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">VERIFIED</text>

    <!-- Table header -->
    <line x1="40" y1="125" x2="280" y2="125" stroke="#334155" stroke-width="1"/>
    <text x="40" y="140" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">ITEM DESCRIPTION</text>
    <text x="180" y="140" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">QTY</text>
    <text x="240" y="140" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">TOTAL</text>

    <!-- Rows -->
    <text x="40" y="160" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11">Enterprise License</text>
    <text x="185" y="160" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11">01</text>
    <text x="240" y="160" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11">$1,200</text>

    <text x="40" y="180" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11">Cloud Infrastructure</text>
    <text x="185" y="180" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11">03</text>
    <text x="240" y="180" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11">$450</text>

    <line x1="40" y1="195" x2="280" y2="195" stroke="#334155" stroke-width="1"/>
    
    <text x="160" y="215" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Tax (18%) &amp; Discount:</text>
    <text x="250" y="215" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="10">-$150</text>

    <text x="160" y="235" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Grand Total:</text>
    <text x="240" y="235" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">$1,500</text>

    <!-- One Click PDF Download Button Mockup -->
    <g transform="translate(25, 290)">
      <rect width="270" height="50" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="35" cy="25" r="14" fill="#10b981"/>
      <text x="35" y="30" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" text-anchor="middle">📄</text>
      <text x="65" y="25" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">1-Click PDF Generation</text>
      <text x="65" y="40" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Instant Client Invoicing Engine</text>
      <text x="245" y="31" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="16">→</text>
    </g>
  </g>
</svg>


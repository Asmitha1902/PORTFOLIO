<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1727" />
      <stop offset="50%" stop-color="#0f2942" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
    <linearGradient id="medCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#medBg)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Glowing background circles -->
  <circle cx="620" cy="180" r="160" fill="#06b6d4" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="180" cy="320" r="140" fill="#3b82f6" fill-opacity="0.1" filter="url(#glow)"/>

  <!-- Left Side: Main Title & Features -->
  <g transform="translate(60, 70)">
    <!-- Badge -->
    <rect width="180" height="32" rx="16" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="18" cy="16" r="6" fill="#38bdf8"/>
    <text x="32" y="21" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">HEALTHCARE AI</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">MediLink</text>
    <text x="0" y="115" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600">AI Healthcare Platform</text>

    <!-- Subtitle / Highlight text -->
    <text x="0" y="155" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      <tspan x="0" dy="0">Intelligent Electronic Health Records (EHR) &amp;</tspan>
      <tspan x="0" dy="24">Role-Based Hospital Administration Portal</tspan>
    </text>

    <!-- 3 Roles Tag Pills -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="90" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="45" y="18" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500" text-anchor="middle">👨‍⚕️ Doctor</text>

      <rect x="100" y="0" width="90" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="145" y="18" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500" text-anchor="middle">🧑 Patient</text>

      <rect x="200" y="0" width="90" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="245" y="18" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500" text-anchor="middle">🛡️ Admin</text>
    </g>

    <!-- Tech Stack badges -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="65" height="24" rx="4" fill="#0284c7" fill-opacity="0.3"/>
      <text x="32.5" y="16" fill="#7dd3fc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">React.js</text>

      <rect x="73" y="0" width="85" height="24" rx="4" fill="#0284c7" fill-opacity="0.3"/>
      <text x="115.5" y="16" fill="#7dd3fc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Spring Boot</text>

      <rect x="166" y="0" width="60" height="24" rx="4" fill="#0284c7" fill-opacity="0.3"/>
      <text x="196" y="16" fill="#7dd3fc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">MySQL</text>

      <rect x="234" y="0" width="65" height="24" rx="4" fill="#0284c7" fill-opacity="0.3"/>
      <text x="266.5" y="16" fill="#7dd3fc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">AWS S3</text>
    </g>
  </g>

  <!-- Right Side: Graphic UI Mockup Card -->
  <g transform="translate(420, 55)">
    <!-- Main UI Card -->
    <rect width="320" height="370" rx="16" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>
    
    <!-- Window controls -->
    <circle cx="25" cy="25" r="5" fill="#ef4444"/>
    <circle cx="42" cy="25" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="25" r="5" fill="#10b981"/>
    <text x="160" y="29" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">medilink.hospital/ehr-portal</text>
    <line x1="0" y1="45" x2="320" y2="45" stroke="#334155" stroke-width="1"/>

    <!-- Pulse ECG line -->
    <path d="M 20 100 L 70 100 L 85 70 L 95 130 L 105 85 L 115 110 L 125 100 L 170 100 L 185 60 L 200 140 L 210 90 L 225 100 L 300 100" 
          fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- EHR Status Card Inside -->
    <rect x="20" y="140" width="280" height="95" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="48" cy="175" r="18" fill="#0284c7" fill-opacity="0.3"/>
    <text x="48" y="181" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="18" text-anchor="middle">🩺</text>
    
    <text x="78" y="168" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600">Patient Electronic Record</text>
    <text x="78" y="188" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Encrypted AWS S3 Storage</text>
    <text x="78" y="210" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">● Real-time Sync Active</text>

    <!-- QR Code & Token Queue Box -->
    <rect x="20" y="250" width="132" height="100" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <!-- QR Mini Pattern -->
    <g transform="translate(32, 262)">
      <rect width="36" height="36" fill="#ffffff" rx="4"/>
      <rect x="4" y="4" width="10" height="10" fill="#0f172a"/>
      <rect x="22" y="4" width="10" height="10" fill="#0f172a"/>
      <rect x="4" y="22" width="10" height="10" fill="#0f172a"/>
      <rect x="18" y="18" width="6" height="6" fill="#0f172a"/>
    </g>
    <text x="78" y="280" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">QR Check-In</text>
    <text x="78" y="296" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Fast OPD Access</text>
    <text x="28" y="332" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Smart Token System</text>

    <!-- Security Badge Box -->
    <rect x="168" y="250" width="132" height="100" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="234" y="280" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="18" text-anchor="middle">🔐</text>
    <text x="234" y="306" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">JWT Security</text>
    <text x="234" y="326" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Role-Based Access</text>
  </g>
</svg>

